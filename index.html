<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrevista de Emprego</title>

    <style>
        {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            font-size: 15px;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 {
            font-size: 20px;
            color: #1e3a8a;
            margin-top: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 6px;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 14px;
            background: transparent;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .linha {
            display: flex;
            gap: 20px;
        }

        .linha div {
            flex: 1;
        }

        .opcoes {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .opcoes label {
            font-weight: normal;
            margin: 0;
        }

        .opcoes input {
            width: auto;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #172e6b;
        }

        footer {
            text-align: center;
            margin: 40px 0 20px;
            color: #777;
            font-size: 13px;
        }

        (max-width: 600px) {
            .linha {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Entrevista de Emprego/trabalho</h1>
    <p>Preencha seus dados para participar do processo seletivo.</p>
</header>

<main>

    <form>

        <h2>Dados pessoais</h2>

        <label>Nome completo</label>
        <input type="text" placeholder="Digite seu nome">

        <div class="linha">
            <div>
                <label>E-mail</label>
                <input type="email" placeholder="Digite seu e-mail">
            </div>

            <div>
                <label>Telefone</label>
                <input type="tel" placeholder="(00) 00000-0000">
            </div>
        </div>

        <label>Data de nascimento</label>
        <input type="text" placeholder="DD/MM/AAAA" maxlength="10">


        <h2>Informações profissionais</h2>

        <label>O que você procura?</label>
        <input type="text" placeholder="Escreva o que você procura profissionalmente">

        <label>Experiência profissional</label>
        <textarea placeholder="Conte brevemente sobre suas experiências profissionais."></textarea>

        <label>Formação</label>
        <input type="text" placeholder="Ex.: Ensino Médio, Técnico, Faculdade...">


        <h2>Entrevista</h2>

        <label>Por que você deseja trabalhar conosco?</label>
        <textarea placeholder="Digite sua resposta"></textarea>

        <label>Quais são seus principais pontos fortes?</label>
        <textarea placeholder="Digite sua resposta"></textarea>

        <label>Você possui disponibilidade para trabalhar presencialmente?</label>

        <div class="opcoes">
            <label>
                <input type="radio" name="presencial">
                Sim
            </label>

            <label>
                <input type="radio" name="presencial">
                Não
            </label>

            <label>
                <input type="radio" name="presencial">
                Parcialmente
            </label>
        </div>

        <button type="submit">Enviar candidatura</button>

    </form>

</main>

<footer>
</footer>

</body>
</html>
